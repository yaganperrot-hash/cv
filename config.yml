# ---------------------------------------------------------------------------
# Champs minimum attendus dans le CV d'un alternant IT.
#
# Ce fichier est la SOURCE DE VÉRITÉ : le script ne code aucun champ en dur.
# Ajouter / retirer / assouplir un critère = éditer ce fichier, pas le Python.
# Test CI — premier run en conditions réelles (2026-08-26)
#
# Types de champ :
#   heading  : un titre de niveau `level` doit exister et matcher `pattern`
#   section  : une section `## <titre>` doit exister (alias dans `titles`)
#              et contenir au moins `min_words` mots
#   regex    : `pattern` doit être trouvé dans `scope`
#   all_of   : TOUTES les règles de `rules` doivent être trouvées dans `scope`
#
# `scope`     : `document` (tout le CV) ou `section:<id d'un champ de type section>`
# `normalize` : si true (défaut), la recherche se fait sur un texte mis en
#               minuscules et débarrassé de ses accents ; écrire les motifs en
#               minuscules sans accent (ex. `ecole`, `des que possible`).
# `help`      : message affiché à l'étudiant quand le champ est absent.
# ---------------------------------------------------------------------------
version: 1

parsing:
  # Les sections du CV sont des titres Markdown de ce niveau ("## ").
  section_level: 2

fields:
  - id: full_name
    label: "Nom et prénom"
    type: heading
    level: 1
    normalize: false
    pattern: "^[^\\W\\d_][\\w'’.-]*(?:\\s+[^\\W\\d_][\\w'’.-]*)+$"
    help: >-
      Commence le CV par un titre de niveau 1 avec ton prénom ET ton nom,
      par exemple : `# Camille Dubois`.

  - id: email
    label: "Email"
    type: regex
    scope: document
    normalize: false
    pattern: '(?<![\w.+-])[A-Za-z0-9._%+-]+@[A-Za-z0-9-]+(?:\.[A-Za-z0-9-]+)*\.[A-Za-z]{2,}(?![\w-])'
    help: >-
      Ajoute une adresse email valide dans l'en-tête du CV
      (format attendu : prenom.nom@domaine.fr).

  - id: phone
    label: "Téléphone"
    type: regex
    scope: document
    normalize: false
    pattern: '(?<!\d)(?:(?:\+33|0033)\s?[1-9]|0[1-9])(?:[\s.\-]?\d{2}){4}(?!\d)'
    help: >-
      Ajoute un numéro de téléphone français valide
      (formats acceptés : `06 12 34 56 78`, `06.12.34.56.78`, `+33 6 12 34 56 78`).

  - id: formation
    label: "Section Formation"
    type: section
    titles: ["formation", "formations", "parcours de formation", "etudes", "cursus"]
    min_words: 8
    help: >-
      Ajoute une section `## Formation` listant tes diplômes et ton cursus
      en cours (intitulé, établissement, dates).

  - id: experience
    label: "Section Expérience"
    type: section
    titles:
      ["experience", "experiences", "experience professionnelle",
       "experiences professionnelles", "parcours professionnel", "stages"]
    min_words: 8
    help: >-
      Ajoute une section `## Expérience` : stages, projets, jobs.
      Poste, entreprise, dates, et 2–3 puces de réalisations concrètes.

  - id: competences
    label: "Section Compétences"
    type: section
    titles:
      ["competences", "competence", "competences techniques",
       "skills", "stack technique"]
    min_words: 5
    help: >-
      Ajoute une section `## Compétences` (langages, frameworks, outils,
      systèmes, langues).

  - id: rythme_alternance
    label: "Rythme d'alternance"
    type: all_of
    scope: document
    help: >-
      Précise le rythme d'alternance quelque part dans le CV (en-tête ou
      section `## Alternance`) : 3 semaines en entreprise, 1 vendredi sur 3
      à l'école, 33 h d'e-learning sur 3 semaines.
    rules:
      - id: entreprise
        label: "3 semaines en entreprise"
        pattern: '3\s*semaines?[^\n]{0,40}entreprise'
        help: "Mentionne « 3 semaines en entreprise »."
      - id: ecole
        label: "1 vendredi sur 3 à l'école"
        pattern: '(?:1|un)\s*vendredi\s*sur\s*3[^\n]{0,40}(?:ecole|etna)'
        help: "Mentionne « 1 vendredi sur 3 à l'école »."
      - id: elearning
        label: "33 h d'e-learning sur 3 semaines"
        pattern: '33\s*h(?:eures?)?[^\n]{0,40}e-?\s?learning'
        help: "Mentionne « 33 h d'e-learning sur 3 semaines »."

  - id: disponibilite
    label: "Disponibilité"
    type: regex
    scope: document
    pattern: 'des\s+que\s+possible'
    help: >-
      Indique ta disponibilité avec la formule attendue : « dès que possible »
      (par exemple : `**Disponibilité :** dès que possible`).
